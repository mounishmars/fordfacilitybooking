services:
  postgres:
    image: postgres:16-alpine
    container_name: ford-facility-db
    environment:
      POSTGRES_USER: ford
      POSTGRES_PASSWORD: ford
      POSTGRES_DB: facility_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ford -d facility_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
